
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Promedio de Notas Exacta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
 
    <div class="contenedor-principal">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>
 
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" step="0.1" min="0" max="5">
 
        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" step="0.1" min="0" max="5">
 
        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" step="0.1" min="0" max="5">
 
        <button id="btnCalcular">Calcular</button>
 
        <p id="mensajePromedio"></p>
        <p id="mensajeEstado"></p>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
